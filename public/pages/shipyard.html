<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galactic Empire - Shipyard</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/shipyard.css">
</head>
<body class="faction-unsc">
    <div class="game-layout">
        <nav class="top-bar">
            <div class="top-bar-left">
                <a href="planet.html" class="game-title">Galactic Empire</a>
                <span id="faction-badge" style="margin-left:0.5rem; font-size:0.8rem; color:var(--accent);"></span>
            </div>
            <div class="resource-bar">
                <span class="resource supply"><span id="res-supply">0</span></span>
                <span class="resource gas"><span id="res-gas">0</span></span>
            </div>
            <div class="top-bar-right">
                <a href="planet.html" class="nav-link">Planet</a>
                <a href="shipyard.html" class="nav-link active">Shipyard</a>
                <a href="research.html" class="nav-link">Research</a>
                <a href="fleet.html" class="nav-link">Fleet</a>
                <a href="galaxy.html" class="nav-link">Galaxy</a>
                <a href="#" class="nav-link" id="logout-btn">Logout</a>
            </div>
        </nav>
        <main class="main-content">
            <h1>Shipyard</h1>
            <div class="shipyard-grid">
                <div class="panel">
                    <h3>Your Fleet</h3>
                    <div id="fleet-list" class="fleet-list"><p class="empty-queue">No ships yet</p></div>
                </div>
                <div class="panel">
                    <h3>Available Ships</h3>
                    <div id="ship-types" class="ship-types-grid"></div>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/api.js"></script>
    <script src="../js/game.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/ui.js"></script>
    <script>
        document.getElementById('logout-btn').addEventListener('click', e => {
            e.preventDefault();
            Api.logout().then(() => window.location.href = 'login.html');
        });
        App.init('shipyard');
    </script>
</body>
</html>
