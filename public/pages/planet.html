<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galactic Empire - Planet</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/planet.css">
</head>
<body class="faction-unsc">
    <div class="game-layout">
        <nav class="top-bar">
            <div class="top-bar-left">
                <a href="planet.html" class="game-title">Galactic Empire</a>
                <span id="faction-badge" style="margin-left:0.5rem; font-size:0.8rem; color:var(--accent);"></span>
            </div>
            <div class="resource-bar">
                <span class="resource supply"><span id="res-supply">0</span></span>
                <span class="resource gas"><span id="res-gas">0</span></span>
            </div>
            <div class="top-bar-right">
                <a href="planet.html" class="nav-link active">Planet</a>
                <a href="shipyard.html" class="nav-link">Shipyard</a>
                <a href="research.html" class="nav-link">Research</a>
                <a href="fleet.html" class="nav-link">Fleet</a>
                <a href="galaxy.html" class="nav-link">Galaxy</a>
                <a href="#" class="nav-link" id="logout-btn">Logout</a>
            </div>
        </nav>

        <main class="main-content">
            <div class="planet-header">
                <h1 id="planet-name">My Planet</h1>
                <p class="planet-coords">System <span id="planet-system">1</span> / Position <span id="planet-position">1</span></p>
            </div>

            <div class="planet-grid">
                <div class="panel resource-panel">
                    <h3>Resources</h3>
                    <div class="resource-overview">
                        <div class="res-row"><span class="res-name">Power</span><span class="res-value" id="energy-balance">0</span></div>
                        <div class="res-row"><span class="res-name">Supply</span><span class="res-value" id="res-supply-panel">0</span></div>
                        <div class="res-row"><span class="res-name">Gas</span><span class="res-value" id="res-gas-panel">0</span></div>
                    </div>
                </div>

                <div class="panel building-panel">
                    <h3 id="building-title">Buildings</h3>
                    <div class="building-grid" id="building-grid"></div>
                </div>

                <div class="panel">
                    <h3>Construction Queue</h3>
                    <div id="construction-queue" class="queue-list"><p class="empty-queue">No buildings under construction</p></div>
                </div>

                <div class="panel">
                    <h3>Research Queue</h3>
                    <div id="research-queue" class="queue-list"><p class="empty-queue">No research in progress</p></div>
                </div>
            </div>
        </main>
    </div>

    <div id="building-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3 id="modal-building-name">Building</h3>
            <p id="modal-building-desc" style="font-size:0.85rem; color:var(--text-secondary); margin:0.5rem 0;"></p>
            <div id="modal-building-cost" style="font-size:0.85rem; margin-bottom:0.5rem;"></div>
            <div class="modal-actions">
                <button id="modal-build-btn" class="btn btn-primary">Build</button>
                <button class="btn btn-secondary" id="modal-close-btn">Close</button>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/game.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/ui.js"></script>
    <script>
        document.getElementById('logout-btn').addEventListener('click', e => {
            e.preventDefault();
            Api.logout().then(() => window.location.href = 'login.html');
        });
        App.init('planet');
    </script>
</body>
</html>
